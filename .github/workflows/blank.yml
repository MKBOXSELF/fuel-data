name: Update Fuel Data

on:
  schedule:
    # Esegue ogni 15 minuti
    - cron: '*/15 * * * *'
  workflow_dispatch: # Permette di avviarlo manualmente

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch data from Apps Script
        run: |
          curl -L -o stations.json "https://script.google.com/macros/s/AKfycbw_zwZsyeQfpOVyb53X7Hv41Fl4lKzAG2E08rLbhkE53aDBfiG2jIEo53wVQKFwdc6psA/exec"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stations.json
          # Il commit avviene solo se il file è cambiato
          git diff --staged --quiet || git commit -m "data: update stations.json $(date -u +%F)"
          git push
